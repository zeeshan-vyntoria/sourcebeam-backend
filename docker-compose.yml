services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sourcebeam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - sourcebeam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sourcebeam"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sourcebeam}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sourcebeam-development}
    ports:
      - "9001:9001"
    volumes:
      - sourcebeam_object_data:/data

  backend:
    build: .
    command: sh -c "python -m alembic upgrade head && python run_server.py"
    environment: &backend-environment
      ENVIRONMENT: production
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg_async://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sourcebeam
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env.docker}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.docker}
      ALLOWED_ORIGINS: http://localhost:5173
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: sourcebeam
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sourcebeam}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sourcebeam-development}
      OCR_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: python worker.py
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      backend:
        condition: service_healthy

  frontend:
    build: ../py-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sourcebeam_postgres_data:
  sourcebeam_object_data:
